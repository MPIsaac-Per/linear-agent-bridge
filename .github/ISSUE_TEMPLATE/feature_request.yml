name: Feature Request
description: Suggest an idea or enhancement for Linear Agent Bridge
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What would you like to see added?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: What problem does this solve?
    validations:
      required: true
