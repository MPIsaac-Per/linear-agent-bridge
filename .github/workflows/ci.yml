name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployment syntax
        run: |
          bash -n deploy/install.sh deploy/run.sh deploy/verify-ingress.sh
          node --check deploy/parse-funnel-status.mjs
          python3 -m py_compile deploy/tcp_forward.py test/test_tcp_forward.py

      - name: Test diagnostic forwarder
        run: python3 -m unittest discover -s test -p 'test_tcp_forward.py'

      - name: Typecheck
        run: npm run typecheck

      - name: MPI-1448 lost-prompt/later-stop regression
        run: npm test -- --run test/server.test.ts -t 'MPI-1448:'

      - name: Test complete suite
        run: npm test

      - name: Test macOS installer transaction
        run: npm run test:install

      - name: Build
        run: npm run build
